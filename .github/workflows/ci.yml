name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: php tools/release.php
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-pilot-source
          path: dist/*

  portable-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.2' }
          - { os: ubuntu-latest, php: '8.3' }
          - { os: ubuntu-latest, php: '8.4' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: windows-latest, php: '8.4' }
          - { os: macos-latest, php: '8.4' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - if: runner.os != 'Windows'
        run: composer test -- --exclude-group real-laravel
      - if: runner.os == 'Windows'
        run: composer test -- --exclude-group real-laravel,unix-sail,unix-shell

  laravel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.2', laravel: '11' }
          - { os: ubuntu-latest, php: '8.4', laravel: '11' }
          - { os: ubuntu-latest, php: '8.2', laravel: '12' }
          - { os: ubuntu-latest, php: '8.5', laravel: '12' }
          - { os: ubuntu-latest, php: '8.3', laravel: '13' }
          - { os: ubuntu-latest, php: '8.5', laravel: '13' }
          - { os: windows-latest, php: '8.4', laravel: '12' }
          - { os: macos-latest, php: '8.4', laravel: '13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/prepare-fixture.php
      - run: composer update --working-dir=tests/laravel --with "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --prefer-dist
      - if: runner.os != 'Windows'
        run: composer test -- --fail-on-skipped
      - if: runner.os == 'Windows'
        run: composer test -- --exclude-group unix-sail,unix-shell --fail-on-skipped

  terminal-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: python3 tools/terminal-smoke.py
      - run: docker pull php:8.3-cli-alpine
      - run: python3 tools/docker-smoke.py
      - run: php tools/prepare-fixture.php
      - run: composer update --working-dir=tests/laravel --with "laravel/framework:^13.0" --no-interaction --prefer-dist
      - run: docker pull php:8.4-fpm-alpine
      - run: php tools/prepare-test-runner.php pest 13
      - run: composer install --working-dir=build/runners/pest-13 --no-interaction --prefer-dist
      - run: python3 tools/sail-smoke.py build/runners/pest-13

  bare-shortcuts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/prepare-fixture.php
      - run: composer update --working-dir=tests/laravel --with "laravel/framework:^12.0" --no-interaction --prefer-dist
      - run: python3 tools/bare-shortcuts-smoke.py

  test-runners:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: phpunit, php: '8.2', laravel: '11' }
          - { mode: pest, php: '8.2', laravel: '11' }
          - { mode: phpunit, php: '8.3', laravel: '12' }
          - { mode: pest, php: '8.3', laravel: '12' }
          - { mode: phpunit, php: '8.5', laravel: '13' }
          - { mode: pest, php: '8.5', laravel: '13' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/prepare-test-runner.php ${{ matrix.mode }} ${{ matrix.laravel }}
      - run: composer install --working-dir=build/runners/${{ matrix.mode }}-${{ matrix.laravel }} --no-interaction --prefer-dist
      - run: php tools/test-runners-smoke.php ${{ matrix.mode }} ${{ matrix.laravel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-${{ matrix.mode }}-${{ matrix.laravel }}
          path: build/qa/runners/

  command-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/prepare-fixture.php
      - run: composer update --working-dir=tests/laravel --with 'laravel/framework:^13.0' --no-interaction --prefer-dist
      - run: php tools/audit-commands.php tests/laravel laravel13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovered-command-audit
          path: build/qa/commands/
